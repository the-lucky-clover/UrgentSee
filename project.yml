name: UrgentSee
options:
  bundleIdPrefix: com.urgentsee

schemes:
  UrgentSee:
    build:
      targets:
        UrgentSee: all
        UrgentSeeTests: [test]
    run:
      config: Debug
      commandLineArguments:
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
      targets:
        - name: UrgentSeeTests
          parallelizable: true
          randomExecutionOrder: false

targets:
  UrgentSee:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - UrgentSee/App
      - UrgentSee/Core
      - path: UrgentSee/Shared
        excludes:
          - Info.plist
      - UrgentSee/Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.2
        DEVELOPMENT_TEAM: 538QNVLWHG
        CODE_SIGN_STYLE: Automatic
    info:
      path: UrgentSee/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
          UIImageName: LaunchScreenIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIUserInterfaceStyle: Dark
    entitlements:
      path: UrgentSee/Entitlements/UrgentSee.entitlements
      properties:
        aps-environment: development
    dependencies:
      - target: UrgentSeeShared
        embed: false
    
  UrgentSeeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - UrgentSeeTests
      - UrgentSee/Core/E2EEManager.swift
      - UrgentSee/Core/APIService.swift
    settings:
      base:
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.2
        DEVELOPMENT_TEAM: 538QNVLWHG
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: -framework CryptoKit -framework Security

  UrgentSeeLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - UrgentSeeLiveActivityExtension
    settings:
      BASE:
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.2
        DEVELOPMENT_TEAM: 538QNVLWHG
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: UrgentSeeLiveActivityExtension/Info.plist
    entitlements:
      path: UrgentSeeLiveActivityExtension/Entitlements/UrgentSeeLiveActivity.entitlements
    dependencies:
      - target: UrgentSeeShared
        embed: false

  UrgentSeeShared:
    type: library.static
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - UrgentSee/Shared
    settings:
      BASE:
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.2
        DEVELOPMENT_TEAM: 538QNVLWHG
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: UrgentSee/Shared/Info.plist
